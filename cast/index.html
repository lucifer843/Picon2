<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Lux Cast Receiver</title>

    <script
        type="text/javascript"
        src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js">
    </script>

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            background: #000;
            color: #fff;
            font-family: sans-serif;
        }

        #status {
            position: absolute;
            left: 40px;
            bottom: 40px;
            font-size: 28px;
        }
    </style>
</head>

<body>

<div id="status">Lux Cast Receiver</div>

<script>
const context = cast.framework.CastReceiverContext.getInstance();
const playerManager = context.getPlayerManager();

const status = document.getElementById('status');

playerManager.setMessageInterceptor(
    cast.framework.messages.MessageType.LOAD,
    loadRequestData => {

        const media = loadRequestData.media;
        const customData =
            media && media.customData
                ? media.customData
                : {};

        status.textContent =
            'Lux Cast · ' +
            (media && media.metadata && media.metadata.title
                ? media.metadata.title
                : 'Canal');

        /*
         * RECEIVER_V1
         *
         * De momento NO manipulamos DRM.
         *
         * Primero verificamos:
         * 1. Que nuestro receiver arranca.
         * 2. Que recibe el LOAD.
         * 3. Que reproduce LA 1.
         * 4. Que recibe customData.
         *
         * Después añadiremos ClearKey.
         */

        return loadRequestData;
    }
);

playerManager.addEventListener(
    cast.framework.events.EventType.ERROR,
    event => {
        console.error('LUX CAST ERROR', event);

        status.textContent =
            'Lux Cast · Error de reproducción';
    }
);

context.start();
</script>

</body>
</html>
